---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: anura-os
description: This is my personal BlueBuild image based on secureblue.

base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - name: duxlabs/dms
          chroot: fedora-45-x86_64

    install:
      packages:
        - umbriel-nightly
        - dms
        - dux-greeter
        - dux-files
        - dux-search
        - dux-edit
        - dux-calendar
        - dux-gop
        - matugen
        - ghostty
        - tailscale
        - papirus-icon-theme
    remove:
      packages:
        - sway
        - sway-config-fedora
        - swaybg
        - swayidle
        - swaylock
        - kanshi
        - grim
        - slurp
        - grimshot
        - waybar
        - foot
        - fuzzel
        - mako
        - sddm
        - sddm-wayland-sway
        - xdg-desktop-portal-wlr
  - type: systemd
    system:
      enabled: [greetd.service]
      # disabled: [sddm.service]

  - type: default-flatpaks
    configurations:
      - notify: true
        install:
          # Utilities
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - org.gnome.Loupe
          - org.upscayl.Upscayl
          - io.github.celluloid_player.Celluloid
          - org.gnome.gitlab.YaLTeR.VideoTrimmer
          - io.github.wartybix.Constrict
          - com.jeffser.Nocturne
          - org.musicbrainz.Picard
          - com.github.wwmm.easyeffects
          - org.localsend.localsend_app
          - org.fedoraproject.MediaWriter
          - it.mijorus.gearlever

          # Creative + dev
          - dev.zed.Zed
          - io.github.MakovWait.Godots
          - md.obsidian.Obsidian
          - net.pixieditor.PixiEditor
          - org.gimp.GIMP
          - org.kde.krita

          # Gaming
          - com.valvesoftware.Steam
          - io.github.Foldex.AdwSteamGtk
          - com.steamgriddb.SGDBoop
          - com.vysp3r.ProtonPlus
          - com.heroicgameslauncher.hgl
          - org.prismlauncher.PrismLauncher
          - io.github.wivrn.wivrn

          # Misc
          - com.discordapp.Discord
          - dev.vencord.Vesktop
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
